name: Release

# Publishes the panel image and the agent binaries. Once this has run for a
# release, install-panel.sh pulls instead of building on the operator's server.
#
# Tag with a pre-release identifier — v0.2.0-beta.1, v0.2.0-rc.1 — and the
# release is marked as a pre-release and does NOT move :latest, so a beta never
# reaches installs that follow the stable channel.
on:
  push:
    tags: ['v*']
  # A manual run without a version publishes a moving :edge build. Giving it a
  # version cuts a real release from the current commit — the tag is created by
  # this workflow rather than pushed, which is the only route when the machine
  # doing the release cannot push tag refs itself.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.7.0. Leave empty for an edge build.'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      release: ${{ steps.v.outputs.release }}
      tags: ${{ steps.v.outputs.tags }}
    steps:
      - id: v
        run: |
          set -euo pipefail
          image="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/amneziax-panel"

          requested='${{ inputs.version }}'
          requested="${requested#v}"

          # release=true means "publish a GitHub release and move :latest",
          # which a tag push and a versioned manual run both mean.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            release=true
          elif [ -n "$requested" ]; then
            case "$requested" in
              [0-9]*.[0-9]*.[0-9]*) ;;
              *) echo "::error::version must look like 1.2.3, got '$requested'"; exit 1 ;;
            esac
            version="$requested"
            release=true
          else
            # A manual run publishes a moving :edge build, never :latest.
            version="edge-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
            release=false
          fi

          # Semver says anything after a hyphen is a pre-release identifier.
          if [ "$release" != true ] || [ "${version#*-}" != "$version" ]; then
            prerelease=true
          else
            prerelease=false
          fi

          tags="$image:$version"
          if [ "$prerelease" = false ]; then
            tags="$tags,$image:latest"
          elif [ "$release" != true ]; then
            tags="$tags,$image:edge"
          fi

          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "release=$release"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"

          echo "### Release \`$version\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- pre-release: \`$prerelease\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- image tags: \`$tags\`" >> "$GITHUB_STEP_SUMMARY"

  image:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.panel
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.meta.outputs.tags }}
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries:
    # Waits for the image on purpose. This job is what publishes the GitHub
    # release, and the two ran in parallel: binaries finish in about a minute
    # while the multi-arch image takes three or four. For those minutes a
    # release was announced that :latest did not yet point at, so anyone
    # installing in that window got the previous version and no way to tell.
    # A release should never be visible before the artifacts it names exist.
    needs: [meta, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the agent
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X github.com/SpecFlowdev/AmneziaX/internal/version.Version=$VERSION -X github.com/SpecFlowdev/AmneziaX/internal/version.Commit=$GITHUB_SHA" \
              -o "dist/amneziax-node-linux-$arch" ./cmd/node
          done
          (cd dist && sha256sum ./* > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: agent-binaries
          path: dist/
      - uses: softprops/action-gh-release@v2
        if: needs.meta.outputs.release == 'true'
        with:
          files: dist/*
          # Named explicitly so a versioned manual run creates the tag here,
          # pointing at the commit this release was actually built from.
          tag_name: v${{ needs.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          # A pre-release must never become the target of
          # /releases/latest/download, which is where node installs look.
          make_latest: ${{ needs.meta.outputs.prerelease == 'true' && 'false' || 'true' }}
