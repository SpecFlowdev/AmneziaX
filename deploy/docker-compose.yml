services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amneziax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-amneziax}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-amneziax} -d ${POSTGRES_DB:-amneziax}']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [amneziax]

  panel:
    image: ${PANEL_IMAGE:-ghcr.io/specflowdev/amneziax-panel:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.panel
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-amneziax}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-amneziax}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PANEL_HTTP_ADDR: ':8080'
      PANEL_GRPC_ADDR: ':9090'
      PANEL_PUBLIC_URL: https://${AMNEZIAX_DOMAIN:?AMNEZIAX_DOMAIN is required}
      SUBSCRIPTION_PUBLIC_URL: ${SUBSCRIPTION_PUBLIC_URL:-}
      # Agents reach the panel through Caddy on its own port, over TLS.
      PANEL_GRPC_PUBLIC_HOST: ${AMNEZIAX_DOMAIN}
      PANEL_GRPC_PUBLIC_PORT: ${AMNEZIAX_NODE_PORT:-9999}
      PANEL_GRPC_PUBLIC_TLS: 'true'
      PANEL_ADMIN_USERNAME: ${PANEL_ADMIN_USERNAME:-admin}
      PANEL_ADMIN_PASSWORD: ${PANEL_ADMIN_PASSWORD:-}
      SUBSCRIPTION_TITLE: ${SUBSCRIPTION_TITLE:-AmneziaX}
      SUBSCRIPTION_SUPPORT_URL: ${SUBSCRIPTION_SUPPORT_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # No published ports: the panel is only reachable through Caddy.
    expose:
      - '8080'
      - '9090'
    networks: [amneziax]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [panel]
    environment:
      AMNEZIAX_DOMAIN: ${AMNEZIAX_DOMAIN}
      AMNEZIAX_NODE_PORT: ${AMNEZIAX_NODE_PORT:-9999}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
      # The node control stream, TLS-terminated by Caddy like everything else.
      - '${AMNEZIAX_NODE_PORT:-9999}:${AMNEZIAX_NODE_PORT:-9999}'
    volumes:
      - ${CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [amneziax]

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  amneziax:
    driver: bridge
