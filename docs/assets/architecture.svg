<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Inter, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>AmneziaX architecture</title>
  <desc>Administrators, subscribers and node agents all reach the deployment through Caddy, which terminates TLS and forwards to the panel; the panel stores state in Postgres and pushes rendered configurations to node agents that supervise xray-core.</desc>

  <defs>
    <linearGradient id="crimson" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f43f6e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#26121c"/>
      <stop offset="100%" stop-color="#150a10"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9f1239"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7d5563"/>
    </marker>
  </defs>

  <!-- Every panel is filled, so the diagram reads on a light or a dark page. -->
  <rect x="0" y="0" width="900" height="520" rx="18" fill="#0b0509"/>

  <!-- ------------------------------------------------------------ clients -->
  <g>
    <rect x="34" y="60" width="176" height="52" rx="12" fill="#1d0e16" stroke="#3a1626"/>
    <text x="56" y="83" fill="#fdeef3" font-size="14" font-weight="600">Administrator</text>
    <text x="56" y="101" fill="#916b7b" font-size="11.5">browser · REST API</text>

    <rect x="34" y="128" width="176" height="52" rx="12" fill="#1d0e16" stroke="#3a1626"/>
    <text x="56" y="151" fill="#fdeef3" font-size="14" font-weight="600">Subscriber</text>
    <text x="56" y="169" fill="#916b7b" font-size="11.5">/sub/&lt;uuid&gt;</text>

    <rect x="34" y="196" width="176" height="52" rx="12" fill="#1d0e16" stroke="#3a1626"/>
    <text x="56" y="219" fill="#fdeef3" font-size="14" font-weight="600">Node agent</text>
    <text x="56" y="237" fill="#916b7b" font-size="11.5">gRPC, dials out</text>
  </g>

  <!-- --------------------------------------------------------------- caddy -->
  <g>
    <rect x="286" y="60" width="182" height="188" rx="14" fill="url(#panel)" stroke="#3a1626"/>
    <rect x="286" y="60" width="182" height="4" rx="2" fill="url(#crimson)"/>
    <text x="308" y="94" fill="#fdeef3" font-size="15" font-weight="700">Caddy</text>
    <text x="308" y="113" fill="#916b7b" font-size="11.5">TLS · Let's Encrypt</text>

    <rect x="308" y="130" width="138" height="34" rx="9" fill="#26121c" stroke="#4a1c2e"/>
    <text x="322" y="146" fill="#fda4b8" font-size="12" font-weight="600">:443</text>
    <text x="322" y="159" fill="#916b7b" font-size="10.5">web UI · API · /sub</text>

    <rect x="308" y="172" width="138" height="34" rx="9" fill="#26121c" stroke="#4a1c2e"/>
    <text x="322" y="188" fill="#fda4b8" font-size="12" font-weight="600">:9999</text>
    <text x="322" y="201" fill="#916b7b" font-size="10.5">node control stream</text>

    <text x="308" y="228" fill="#6f4f5c" font-size="10.5">:80 — ACME only</text>
  </g>

  <!-- --------------------------------------------------------------- panel -->
  <g>
    <rect x="544" y="60" width="196" height="188" rx="14" fill="url(#panel)" stroke="#3a1626"/>
    <rect x="544" y="60" width="196" height="4" rx="2" fill="url(#crimson)"/>
    <text x="566" y="94" fill="#fdeef3" font-size="15" font-weight="700">Panel</text>
    <text x="566" y="113" fill="#916b7b" font-size="11.5">no host port of its own</text>

    <rect x="566" y="130" width="152" height="34" rx="9" fill="#26121c" stroke="#4a1c2e"/>
    <text x="580" y="146" fill="#fda4b8" font-size="12" font-weight="600">:8080</text>
    <text x="580" y="159" fill="#916b7b" font-size="10.5">API + embedded SPA</text>

    <rect x="566" y="172" width="152" height="34" rx="9" fill="#26121c" stroke="#4a1c2e"/>
    <text x="580" y="188" fill="#fda4b8" font-size="12" font-weight="600">:9090</text>
    <text x="580" y="201" fill="#916b7b" font-size="10.5">gRPC (h2c)</text>

    <text x="566" y="228" fill="#6f4f5c" font-size="10.5">renders config · collects usage</text>
  </g>

  <!-- ------------------------------------------------------------ postgres -->
  <g>
    <rect x="784" y="112" width="86" height="84" rx="12" fill="#1d0e16" stroke="#3a1626"/>
    <ellipse cx="827" cy="140" rx="24" ry="8" fill="none" stroke="#fb7195" stroke-width="1.6"/>
    <path d="M803 140 v22 a24 8 0 0 0 48 0 v-22" fill="none" stroke="#fb7195" stroke-width="1.6"/>
    <text x="827" y="184" fill="#c99cae" font-size="11.5" text-anchor="middle">Postgres</text>
  </g>

  <!-- --------------------------------------------------------------- edges -->
  <g stroke-width="1.8" fill="none">
    <path d="M210 86 H286" stroke="#9f1239" marker-end="url(#arrow)"/>
    <path d="M210 154 H286" stroke="#9f1239" marker-end="url(#arrow)"/>
    <path d="M210 222 H286" stroke="#9f1239" marker-end="url(#arrow)"/>

    <path d="M468 147 H544" stroke="#9f1239" marker-end="url(#arrow)"/>
    <path d="M468 189 H544" stroke="#9f1239" marker-end="url(#arrow)"/>
    <path d="M740 154 H784" stroke="#7d5563" marker-end="url(#arrowMuted)"/>
  </g>
  <text x="506" y="140" fill="#7d5563" font-size="10" text-anchor="middle">http</text>
  <text x="506" y="182" fill="#7d5563" font-size="10" text-anchor="middle">h2c</text>

  <!-- ---------------------------------------------------------------- nodes -->
  <g>
    <rect x="286" y="316" width="454" height="4" rx="2" fill="#3a1626"/>
    <text x="286" y="304" fill="#916b7b" font-size="11.5">one persistent bidirectional stream per node</text>

    <path d="M642 248 V300" stroke="#9f1239" stroke-width="1.8" fill="none"/>
    <path d="M642 320 V346" stroke="#9f1239" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
    <path d="M380 320 V346" stroke="#9f1239" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
    <path d="M511 320 V346" stroke="#9f1239" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  </g>

  <g>
    <rect x="300" y="352" width="160" height="112" rx="12" fill="#150a10" stroke="#3a1626"/>
    <text x="320" y="378" fill="#fdeef3" font-size="13.5" font-weight="600">Node · NL</text>
    <text x="320" y="397" fill="#916b7b" font-size="11">agent + xray-core</text>
    <rect x="320" y="410" width="120" height="26" rx="7" fill="#26121c" stroke="#4a1c2e"/>
    <text x="332" y="427" fill="#fda4b8" font-size="10.5">vless · reality :443</text>
    <text x="320" y="452" fill="#6f4f5c" font-size="10">no inbound mgmt port</text>
  </g>

  <g>
    <rect x="480" y="352" width="160" height="112" rx="12" fill="#150a10" stroke="#3a1626"/>
    <text x="500" y="378" fill="#fdeef3" font-size="13.5" font-weight="600">Node · DE</text>
    <text x="500" y="397" fill="#916b7b" font-size="11">agent + xray-core</text>
    <rect x="500" y="410" width="120" height="26" rx="7" fill="#26121c" stroke="#4a1c2e"/>
    <text x="512" y="427" fill="#fda4b8" font-size="10.5">trojan · tls :443</text>
    <text x="500" y="452" fill="#6f4f5c" font-size="10">works behind NAT</text>
  </g>

  <g>
    <rect x="660" y="352" width="160" height="112" rx="12" fill="#150a10" stroke="#3a1626"/>
    <text x="680" y="378" fill="#fdeef3" font-size="13.5" font-weight="600">Node · …</text>
    <text x="680" y="397" fill="#916b7b" font-size="11">agent + xray-core</text>
    <rect x="680" y="410" width="120" height="26" rx="7" fill="#26121c" stroke="#4a1c2e"/>
    <text x="692" y="427" fill="#fda4b8" font-size="10.5">any profile inbound</text>
    <text x="680" y="452" fill="#6f4f5c" font-size="10">added in one command</text>
  </g>

  <!-- ---------------------------------------------------------------- legend -->
  <g>
    <text x="34" y="380" fill="#c99cae" font-size="12" font-weight="600">Down the stream</text>
    <text x="34" y="400" fill="#916b7b" font-size="11">rendered xray config</text>
    <text x="34" y="417" fill="#916b7b" font-size="11">restart · stop · fetch logs</text>

    <text x="34" y="443" fill="#c99cae" font-size="12" font-weight="600">Back up the stream</text>
    <text x="34" y="463" fill="#916b7b" font-size="11">heartbeat · apply result</text>
    <text x="34" y="480" fill="#916b7b" font-size="11">per-user traffic · log tail</text>
  </g>
</svg>
